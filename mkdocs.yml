site_name: Ghi chú lâm sàng Nhi khoa

theme:
  name: material
  language: vi
  font: false
  features:
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - search.suggest
  palette:
    - scheme: default
      primary: custom
      accent: custom

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      toc_depth: 3

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/citations.js
